Commentary: |-
    <i>Jordan Clawson, Jade:</i> (email, 10/9/2026)
    [[artist:jade]]:<br>
    Hello! I am working on a project that includes documenting a few of the albums from the band of [[artist:amazin-blue | Amazin' Blue]], including the album called "[[album:self-titled]]" and that includes documenting what songs that the tracks from that album are covers of. For the most part, this has gone by without problems, with the exception of the song called "The Groove."

    From what I've managed to find out, it seems that this song was made by you, which places it in a unique state compared to all other songs, as those were all covers of popular songs made by people not in that band, so the question I have is simply: Is the song there a cover of another original song made by you, or is it one that was originally made specifically for that Amazin' Blue album? If the former, is there anywhere that the original song exists online? Thank you for your help!

    [[artist:jordan-clawson]]:<br>
    Hi!<br>
    The Groove was an original song I wrote to be performed by Amazin’ Blue and was thrilled it was selected to be on the album. Let me know if you have any additional questions anytime!

    All the best,<br>
    Jordan Clawson

