Category: Hatchetfield
---
Group: Official Discography
Description: |-
    This group consists of that which is officially released by Team Starkid for projects within Hatchetfield.
---
Group: Affiliated Discography
Exclude From Other Group Album Summaries: true
Description: |-
    This group consists of two major things. Number 1 refers to tracks made for Hatchetfield, but that aren't officially part of a Hatchetfield album. This includes scratch albums, demo songs, etc. Number 2 refers to tracks that would generally classify as 'fandom' tracks, but that are made by someone officially connected to Hatchetfield. This includes tracks such as [[artist:jeff-blim|Jeff Blim]]'s [[track:dirty-girl-jeff-blim|Dirty Girl cover]]
---
Group: Fandom
Exclude From Other Group Album Summaries: true
Description: |-
    This group consists of that which is made by the Hatchetfield fandom.
---
Group: Beyond
Exclude From Other Group Album Summaries: true
Description: |-
    This group consists of that which is made by those who have been part of Hatchetfield, even if what is featured here is not directly affiliated with it.
---
Group: Additional Tracks
Exclude From Other Group Album Summaries: true
Description: |-
    This group consists of all that does not fit any of the above categories. Typically, this is used for tracks which are added due to being referenced by a song which does fit one of the above criteria, while the song itself does not.

    Many such tracks will be placed in [[album:references-beyond-hatchetfield]], as it is beyond the purpose of the wiki to have information on every album that has any track at all referenced. If an album were to have 2 or more tracks featured on the wiki however, it is worth considering whether it should be added in its entirety.
---
