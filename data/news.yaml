Name: Welcome to Hatchetfield
Directory: welcome-to-hatchetfield
Date: October 18 2026
Content: |-
    Welcome everyone, to the Beta Launch of the Hatchetfield Music Wiki!

    <hr class="split">

    After a lot of work, the first version of this wiki has finally become ready to launch! It does not yet contain all that I hope to include, however it still contains enough to where I feel it is worth putting up now.

    With only a few days left until Miss Holloween releases, I decided that I wanted to try and get this launched before that, so that others could help me with documenting it along with the general expansion of the wiki! If you know anything within the wikis scope, please feel free to reach out on the [HSMusic Discord](https://preview.hsmusic.wiki/discord/) and contribute!

    So, what has actually been added so far? Well let me tell you:

    <b>1.</b><br>Of course, the first priority was to add all the [[group:official-discography]] to the wiki, though most of this I did not have to do now, as I already had most of this data documented in a previous project on google sheets. (If you want to, you can check it out [here](https://docs.google.com/spreadsheets/d/1cdsKDih47B6yRJ1mefzOOTDLX7inSwIPGVJKLb4rl-Y), though it never got fully finished and might have some errors.)

    <b>2.</b><br>I wanted to add much of the [[group:affiliated-discography]] as well, as to be able to properly showcase what it is seeing as it is not something which the original [HSMusic Wiki](https://hsmusic.wiki/) has. One thing that I was unable to add were the KickStarter scratch tracks for different Hatchetfield projects, as I do not have access to them. If anyone who does would like to contribute them to the wiki, it would be greatly appreciated!

    <b>3.</b><br>I added some of the [[group:fandom]] content that I could find, like a few covers, medleys and fan-songs. The ones currently in the wiki are not all the ones that I have found however, and others will be added in future updates.

    <b>4.</b><br>I've also added some of the [[group:beyond]] content as well, mostly from [[group:jeff-blim]] as well as the albums for two other StarKid musicals of [[album:the-trail-to-oregon-original-starkid-cast-recording|The Trail to Oregon]] and [[album:firebringer-original-cast-recording|Firebringer]], but there are a lot of more things that could get added here in the future.

    <b>Future plans:</b>

    The things of highest priority in the future are first off of course to add the Miss Holloway soundtrack once released, but aside from that, I want to add all the rest of StarKid's musicals, as well as add them into the wiki as [[flash-index:-|videos]] (which also includes adding the Hatchetfield projects not currently represented as videos themselves there). Another project for the future is that I want to document the background music of the Hatchetfield series here as well, though I am not certain how to execute that idea. The current best plan is to divide it into scenes, so that each scene in a particular video counts as a track on an album, however better ideas are very welcome.

    Finding out who the cover artists for each StarKid album are would also be great, but I have been unable to find a place crediting them so far. If you can find a source to credit any or all of them, that would be very appreciated.

    I believe that that is all I have to say at the moment, so please look around the wiki, and contribute if you want to. I've done everything so far almost completely on my own with no one else to double check it, so it's very likely that I have made mistakes in some places. If you find any, please report it in the [HSMusic Discord](https://preview.hsmusic.wiki/discord/) so that it can be fixed!
    
    That was all for now, have a great day!

    ~Jade